<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>NewsPortal</title>
    </head>
    <body>
        <header>
            <h1>News Portal</h1>
        </header>
        <main>
            <div class="sources buttons"></div>
            <div class="news"></div>
        </main>
        <footer>
            <p class="copyright">
                Copyright <a href="https://newsapi.org">NewsAPI</a>
            </p>
        </footer>

        <template id="sourceItemTemp">
            <button class="source__item" type="button" aria-pressed="false">
                <span class="source__item-name"></span>
            </button>
        </template>

        <template id="newsItemTemp">
            <article class="news__item">
                <div class="news__meta"><img class="news__meta-photo" alt="" loading="lazy" /></div>
                <div class="news__description">
                    <p class="news__description-source"></p>
                    <h2 class="news__description-title"></h2>
                    <p class="news__description-content"></p>
                    <div class="news__byline"><span class="news__meta-author"></span><time class="news__meta-date"></time></div>
                    <p class="news__read-more"><a target="_blank" rel="noopener noreferrer">Читать статью ↗</a></p>
                </div>
            </article>
        </template>
    </body>
</html>
