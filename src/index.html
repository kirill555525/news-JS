<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Новостное приложение: учебная миграция с JavaScript на TypeScript." />
    <title>News Portal — источники и новости</title>
</head>
<body>
<header class="page-header">
    <p class="eyebrow">Источники · События · Контекст</p>
    <h1>News Portal<span>.</span></h1>
    <p class="intro">Выберите издание. Узнайте, что происходит.</p>
    <p class="demo-note" hidden>Демонстрационные данные: статьи могут быть одинаковыми для разных источников.</p>
</header>
<main>
    <section class="source-panel" aria-labelledby="sources-title">
        <div class="source-toolbar">
            <div><h2 id="sources-title">Ваши источники</h2><p class="source-count" aria-live="polite"></p></div>
            <label class="search-label" for="source-search">Поиск источника
                <input id="source-search" type="search" placeholder="Например, BBC" autocomplete="off" />
            </label>
        </div>
        <div class="sources" aria-label="Источники новостей"></div>
    </section>
    <p class="status" role="status" aria-live="polite"></p>
    <div class="news" aria-label="Новости"></div>
</main>
<footer>
    <a href="https://github.com/kirill555525" target="_blank" rel="noopener noreferrer">GitHub автора</a>
    <span>© 2026 · Данные <a href="https://newsapi.org/" target="_blank" rel="noopener noreferrer">NewsAPI</a></span>
    <a href="https://rs.school/courses/javascript" target="_blank" rel="noopener noreferrer" aria-label="Курс RS School">
        <img class="course-logo" alt="RS School" width="92" height="36" />
    </a>
</footer>

<template id="sourceItemTemp">
    <button class="source__item" type="button" aria-pressed="false"><span class="source__item-name"></span></button>
</template>
<template id="newsItemTemp">
    <article class="news__item">
        <div class="news__meta"><img class="news__meta-photo" alt="" loading="lazy" /></div>
        <div class="news__description">
            <p class="news__description-source"></p>
            <h2 class="news__description-title"></h2>
            <p class="news__description-content"></p>
            <div class="news__byline"><span class="news__meta-author"></span><time class="news__meta-date"></time></div>
            <p class="news__read-more"><a target="_blank" rel="noopener noreferrer">Читать статью ↗</a></p>
        </div>
    </article>
</template>
</body>
</html>
